<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Email — EduKnight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-form-panel">
    <a href="index.html" class="auth-back-link"><i class="bi bi-arrow-left"></i> Back to home</a>

    <div class="auth-form-wrap" style="text-align:center;">
      <div class="auth-brand" style="justify-content:center;">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M7 21h10M8.5 21c-.5-2.5-.2-4 .8-5.3.9-1.2 1-2 .5-3.2-.6-1.6.2-2.8 1.5-3 .9-.1 1-.7.5-1.4-.7-.9-.4-2 .6-2.3 1.4-.4 2.6.4 2.9 1.7.3 1.4-.3 2.1-1.1 2.6-.9.6-1 1.3-.4 2.4.8 1.5 1.4 3.4.7 6.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>EduKnight</span>
      </div>

      <div class="verify-icon-circle"><i class="bi bi-envelope-paper"></i></div>
      <h1>Verify your email</h1>
      <p class="subtitle">Enter the 6-digit code we sent to your inbox to activate your account.</p>

      <div class="otp-row">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      </div>

      <button class="btn btn-primary btn-lg btn-block" onclick="window.location.href='dashboard.html'">Verify &amp; continue <i class="bi bi-arrow-right"></i></button>
      <p class="subtitle" style="margin-top:20px;">Didn't get a code? <a href="#" style="color:var(--primary);font-weight:600;">Resend</a></p>
    </div>
  </div>

  <div class="auth-brand-panel">
    <div class="content">
      <h2>One last move before the board opens up.</h2>
      <p>Verifying your email keeps battle invites, streak reminders and rank updates landing where they should.</p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
