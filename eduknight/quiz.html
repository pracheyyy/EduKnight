<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz — EduKnight</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/exams.css">
</head>
<body>

<div class="app-shell">
  <div class="mobile-overlay" id="sidebarOverlay"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="d-flex align-items-center">
      <a href="index.html" class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M7 21h10M8.5 21c-.5-2.5-.2-4 .8-5.3.9-1.2 1-2 .5-3.2-.6-1.6.2-2.8 1.5-3 .9-.1 1-.7.5-1.4-.7-.9-.4-2 .6-2.3 1.4-.4 2.6.4 2.9 1.7.3 1.4-.3 2.1-1.1 2.6-.9.6-1 1.3-.4 2.4.8 1.5 1.4 3.4.7 6.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">Edu<span>Knight</span></span>
      </a>
      <button class="mobile-toggle sidebar-close" id="sidebarCloseBtn"><i class="bi bi-x-lg" style="font-size:18px;"></i></button>
    </div>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Main</span>
      <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
      <a href="profile.html" class="sidebar-link"><i class="bi bi-person-circle"></i> Profile</a>
      <a href="exams.html" class="sidebar-link"><i class="bi bi-journal-bookmark"></i> Exams</a>
      <a href="quiz.html" class="sidebar-link active"><i class="bi bi-lightning-charge"></i> Daily Quiz</a>
      <a href="battle.html" class="sidebar-link"><i class="bi bi-controller"></i> 1v1 Battle</a>
      <span class="sidebar-section-label">Compete</span>
      <a href="leaderboard.html" class="sidebar-link"><i class="bi bi-trophy"></i> Leaderboard</a>
      <a href="resources.html" class="sidebar-link"><i class="bi bi-collection-play"></i> Resources</a>
      <span class="sidebar-section-label">Account</span>
      <a href="settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-user-card">
      <div class="avatar-sm" id="sidebarAvatar">P</div>
      <div><div class="u-name" id="sidebarUserName">Loading…</div><div class="u-tier" id="sidebarUserTier">—</div></div>
      <i class="bi bi-box-arrow-right logout-btn" id="logoutBtn" title="Log out"></i>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="mobile-toggle sidebar-toggle-mobile" id="sidebarOpenBtn"><i class="bi bi-list" style="font-size:24px;"></i></button>
        <div class="topbar-search" id="topbarCmdk"><i class="bi bi-search"></i> Search chapters, resources... <kbd>Ctrl K</kbd></div>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <div class="icon-btn"><i class="bi bi-bell"></i><span class="ping"></span></div>
      </div>
    </header>

    <main class="dash-content">
      <div class="quiz-runner-shell" id="quizRunnerShell">
        <div class="empty-state"><i class="bi bi-hourglass-split"></i>Loading your quiz…</div>
      </div>
    </main>
  </div>
</div>

<div class="mobile-overlay" id="cmdkOverlay"></div>
<div id="cmdkPalette" style="display:none;position:fixed;top:14%;left:50%;transform:translateX(-50%);width:min(560px,90vw);background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);border:1px solid var(--border);z-index:1200;overflow:hidden;">
  <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);">
    <i class="bi bi-search" style="color:var(--text-muted);"></i>
    <input id="cmdkInput" type="text" placeholder="Jump to Dashboard, Exams, Battle..." style="border:none;outline:none;background:transparent;flex:1;font-size:15px;color:var(--text);font-family:var(--font-body);">
    <kbd style="border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--text-muted);">Esc</kbd>
  </div>
  <div id="cmdkResults" style="max-height:320px;overflow-y:auto;padding:8px;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="js/app-shell.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
